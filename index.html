<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Configuration Copilot prototype for the Vertex Ops case (HashedIn by Deloitte PM case study). Synthetic data; all customers fictional.">

<title>Configuration Copilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: internal ops console. Left rail of stages (Sales > UAT > Production), working canvas on the right; state shown as chips and stripes. */
:root{
  --bg:#F4F6F8; --panel:#FFFFFF; --ink:#16212E; --muted:#5B6878; --line:#DCE2E8; --soft:#EEF2F5;
  --accent:#0E6B6B; --accent-ink:#FFFFFF; --accent-soft:#E2F1EF;
  --ok:#1F7A4D; --ok-soft:#E3F3EA; --warn:#A76A00; --warn-soft:#FBF0DA; --bad:#B3261E; --bad-soft:#FBE6E4; --info:#3B5BA9; --info-soft:#E7ECF8;
  --rail:#1B2A41; --rail-ink:#D7DEE8; --rail-active:#2A3D5A;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F151D; --panel:#16202B; --ink:#E6ECF2; --muted:#9AA8B8; --line:#2A3746; --soft:#1C2834;
  --accent:#3FB2A8; --accent-ink:#06201E; --accent-soft:#16332F;
  --ok:#5CC48E; --ok-soft:#163223; --warn:#E3A73B; --warn-soft:#352812; --bad:#F07A70; --bad-soft:#3A1A18; --info:#8EA8F0; --info-soft:#1C2540;
  --rail:#0B1118; --rail-ink:#B8C4D2; --rail-active:#1D2A3A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F151D; --panel:#16202B; --ink:#E6ECF2; --muted:#9AA8B8; --line:#2A3746; --soft:#1C2834;
  --accent:#3FB2A8; --accent-ink:#06201E; --accent-soft:#16332F;
  --ok:#5CC48E; --ok-soft:#163223; --warn:#E3A73B; --warn-soft:#352812; --bad:#F07A70; --bad-soft:#3A1A18; --info:#8EA8F0; --info-soft:#1C2540;
  --rail:#0B1118; --rail-ink:#B8C4D2; --rail-active:#1D2A3A; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{background:var(--rail);color:var(--rail-ink);padding:20px 12px;display:flex;flex-direction:column;gap:18px;padding-left:max(12px, env(safe-area-inset-left,0px))}
.brand{padding:0 8px}
.brand b{font-family:var(--display);font-size:19px;color:#fff;display:block;letter-spacing:.2px}
.brand span{font-size:11px;opacity:.75;text-transform:uppercase;letter-spacing:.08em}
.navgroup{display:flex;flex-direction:column;gap:2px}
.navgroup h4{margin:0 8px 4px;font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;opacity:.6;font-weight:600}
.nav{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;font-size:13.5px;color:var(--rail-ink)}
.nav:hover{background:var(--rail-active)}
.nav[aria-current="page"]{background:var(--rail-active);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.nav:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tag{font-size:10px;font-weight:600;padding:1px 6px;border-radius:999px;background:rgba(255,255,255,.12);letter-spacing:.04em}
.legend{margin-top:auto;padding:10px 8px;border-top:1px solid rgba(255,255,255,.12);font-size:11.5px;display:grid;gap:6px}
.legend div{display:flex;gap:8px;align-items:center}
main{padding-block:22px 40px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.head{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end}
.head h1{font-family:var(--display);font-size:24px;margin:0;text-wrap:balance}
.head p{margin:2px 0 0;color:var(--muted);max-width:70ch}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:600}
select,button,textarea{font:inherit}
select{padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 12px;border-radius:6px;font-size:13px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-width:0}
.panel>.ph{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.panel>.ph h2{font-size:14px;margin:0;font-weight:600}
.panel>.pb{padding:12px 14px}
.grid2{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:16px;align-items:start}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.c-ok{background:var(--ok-soft);color:var(--ok)} .c-warn{background:var(--warn-soft);color:var(--warn)} .c-bad{background:var(--bad-soft);color:var(--bad)}
.c-info{background:var(--info-soft);color:var(--info)} .c-acc{background:var(--accent-soft);color:var(--accent)} .c-mut{background:var(--soft);color:var(--muted)}
.layer{font-family:var(--mono);font-size:10.5px;font-weight:500;padding:1px 6px;border-radius:4px;border:1px solid currentColor;opacity:.9}
.L-R{color:var(--info)} .L-J{color:var(--warn)} .L-L{color:var(--accent)} .L-H{color:var(--ok)}
.rail .L-R,.rail .L-J,.rail .L-L,.rail .L-H{filter:brightness(1.5)}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted)}
.kpis{display:flex;flex-wrap:wrap;gap:8px}
.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
.banner.bad{border-color:var(--bad);background:var(--bad-soft)} .banner.ok{border-color:var(--ok);background:var(--ok-soft)} .banner.info{border-color:var(--info);background:var(--info-soft)}
.notes{display:flex;flex-direction:column;gap:8px}
.note{padding:8px 10px;border-left:3px solid var(--line);background:var(--soft);border-radius:0 6px 6px 0;font-size:13.5px}
.note.amb{border-left-color:var(--warn)} .note.clear{border-left-color:var(--ok)} .note.oos{border-left-color:var(--muted)}
.note .meta{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.req{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--panel)}
.req .top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.req .q{background:var(--soft);border-radius:6px;padding:8px 10px}
.req .q label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;display:block;margin-bottom:2px}
.req textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--panel);color:var(--ink)}
.req .acts{display:flex;gap:8px;flex-wrap:wrap}
.req .ans{border-left:3px solid var(--accent);padding:4px 10px}
.list{display:flex;flex-direction:column;gap:10px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
.scroll{overflow-x:auto}
.metrics{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.metric{all:unset;box-sizing:border-box;cursor:default;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--panel);display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden}
.metric::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--ok)}
.metric.fail::before{background:var(--bad)} .metric.wait::before{background:var(--warn)} .metric.fixed::before{background:var(--accent)}
.metric.click{cursor:pointer} .metric.click:hover{border-color:var(--accent)} .metric[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.metric .id{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.metric .nm{font-size:12.5px;font-weight:600;line-height:1.25}
.pipe{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.step{border:1px solid var(--line);border-radius:6px;padding:7px 8px;font-size:12px;background:var(--soft);display:flex;flex-direction:column;gap:3px}
.step b{font-size:12px}
.step .layer,.metric .chip{align-self:flex-start}
.btn.primary .layer{color:var(--accent-ink);border-color:currentColor;opacity:.85}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 12px;font-size:13.5px}
.kv dt{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.kv dd{margin:0}
.box{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.box.prop{border-color:var(--accent);background:var(--accent-soft)} .box.ask{border-color:var(--warn);background:var(--warn-soft)} .box.none{border-color:var(--info);background:var(--info-soft)}
.box h3{margin:0;font-size:13.5px}
.guard{font-size:12.5px;color:var(--bad);display:flex;gap:6px;align-items:baseline}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.dcard{display:flex;flex-direction:column;gap:8px}
.spark{width:100%;height:70px;display:block}
.log{display:flex;flex-direction:column}
.log .row{display:grid;grid-template-columns:120px 120px 46px minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:baseline}
.empty{padding:20px;text-align:center;color:var(--muted)}
.pill-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.small{font-size:12px}
.prog{height:6px;background:var(--soft);border-radius:999px;overflow:hidden;min-width:120px}
.prog i{display:block;height:100%;background:var(--accent)}
.pack td:first-child{width:42%}
@media (max-width: 900px){
  .app{grid-template-columns:1fr}
  .rail{flex-direction:row;overflow-x:auto;padding:10px max(12px, env(safe-area-inset-right,0px)) 10px max(12px, env(safe-area-inset-left,0px));gap:12px;align-items:center}
  .navgroup{flex-direction:row;gap:4px}.navgroup h4{display:none}.legend{display:none}.brand span{display:none}
  .nav{white-space:nowrap}
  .grid2{grid-template-columns:1fr}
  .pipe{grid-template-columns:repeat(3,minmax(0,1fr))}
  .kv{grid-template-columns:1fr}
  .log .row{grid-template-columns:1fr;gap:2px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Copilot sections">
    <div class="brand"><b>Configuration Copilot</b><span>Vertex Ops · internal</span></div>
    <div class="navgroup"><h4>Sales · MVP</h4>
      <button class="nav" data-view="clar">Requirement clarification <span class="tag" id="n-clar"></span></button>
      <button class="nav" data-view="checks">Configuration checks <span class="tag" id="n-checks"></span></button>

    <div class="navgroup"><h4>UAT · MVP</h4>

      <div class="small" style="opacity:.7">Synthetic data from the golden data set. All customers are fictional.</div>

  </nav>
  <main><div class="wrap" id="view"></div></main>
</div>

<script>
const D = {"customers":[{"id":"C01","name":"Aravali Agro Distributors","segment":"Distributor","city":"Jaipur","normal":900,"peak":2.2,"peaks":"Rabi & Kharif sowing seasons","wh":3,"source":"ERP","carriers":"2 courier + 1 freight","stage":"Sales","live":""},{"id":"C02","name":"Kesar Naturals","segment":"D2C brand","city":"Pune","normal":1500,"peak":3.0,"peaks":"Diwali, year-end sale","wh":2,"source":"Web store","carriers":"2 courier + 1 freight","stage":"Sales","live":""},{"id":"C03","name":"Konark Auto Spares","segment":"Distributor","city":"Bhubaneswar","normal":1200,"peak":2.9,"peaks":"Diwali","wh":2,"source":"ERP","carriers":"2 courier + 1 freight","stage":"Sales","live":""},{"id":"C04","name":"Meghdoot 3PL Services","segment":"3PL","city":"Nagpur","normal":4000,"peak":2.5,"peaks":"Diwali, month-end","wh":4,"source":"4 client systems","carriers":"3 courier + 1 freight","stage":"Sales","live":""},{"id":"C05","name":"Tanvi Fashion House","segment":"D2C brand","city":"Surat","normal":2200,"peak":3.5,"peaks":"Diwali, wedding season, EOSS","wh":1,"source":"Web store","carriers":"2 courier","stage":"Sales","live":""},{"id":"C06","name":"Sahyadri FMCG Distributors","segment":"Distributor","city":"Nashik","normal":2600,"peak":1.8,"peaks":"Month-end, Diwali","wh":3,"source":"ERP","carriers":"1 courier + 2 freight","stage":"Sales","live":""},{"id":"C07","name":"Vindhya Electricals","segment":"Distributor","city":"Indore","normal":700,"peak":2.0,"peaks":"Summer (Apr-Jun)","wh":2,"source":"ERP","carriers":"1 courier + 1 freight","stage":"Sales","live":""},{"id":"C08","name":"Nilgiri Home Essentials","segment":"D2C brand","city":"Coimbatore","normal":1100,"peak":2.8,"peaks":"Diwali, Pongal","wh":1,"source":"Web store","carriers":"2 courier","stage":"Sales","live":""},{"id":"C09","name":"Ganga Steel Traders","segment":"Distributor","city":"Kanpur","normal":450,"peak":1.6,"peaks":"Quarter-end","wh":2,"source":"ERP","carriers":"2 freight","stage":"UAT","live":""},{"id":"C10","n /* ---------------- Sales: clarification ---------------- */
function clarStatus(c){
  const s = st.clar[c.id].stage;
  if (s === "clear") return `<span class="chip c-ok">Clear</span>`;
  if (s === "routed") return `<span class="chip c-mut">Out of scope · routed to SE</span>`;
  if (s === "resolved") return `<span class="chip c-acc">${esc(c.status)}</span>`;
  if (s === "sent" || s === "sent2") return `<span class="chip c-info">Waiting for customer${s === "sent2" ? " · round 2" : ""}</span>`;
  if (s === "round2") return `<span class="chip c-warn">Answer still vague · round 2 drafted</span>`;
  return `<span class="chip c-warn">Ambiguous · ${esc(c.type)}</span>`;
}
const pendingOf = id => (clarBy[id] || []).filter(c => ["drafted","sent","round2","sent2"].includes(st.clar[c.id].stage)).length;

function viewClar(){
  const id = st.clarCust, cases = clarBy[id] || [], c0 = cust[id];
  const total = cases.length, pend = pendingOf(id), done = total - pend;
  const drafted = cases.filter(c => ["drafted","round2"].includes(st.clar[c.id].stage)).length;
  const notes = cases.map(c => {
    const k = c.flag === "Yes" ? "amb" : c.flag === "No" ? "clear" : "oos";
    return `<div class="note ${k}">${esc(c.note)}<div class="meta"><span class="mono muted">${c.id}</span><span class="mono">${esc(c.settings)}</span></div></div>`;
  }).join("");
  const reqs = cases.map(c => {
    const s = st.clar[c.id], r2 = ROUND2[c.id];
    let body = "";
    if (s.stage === "clear") body = `<div class="small muted">Requirement already gives a concrete value. No question needed.</div><div><b>Value:</b> ${esc(c.resolved)}</div>`;
    else if (s.stage === "routed") body = `<div class="small muted">Not a setting in the platform's modules. Logged for the SE to clarify scope; no customer question drafted.</div><div>${esc(c.resolved)}</div>`;
    else {
      const editing = st.edit[c.id];
      const qLabel = ["round2","sent2"].includes(s.stage) ? "Follow-up question (round 2)" : "Draft question";
      body += `<div class="q"><label>${qLabel} ${L("L")}</label>${editing ? `<textarea id="ta-${c.id}">${esc(s.q)}</textarea>` : esc(s.q)}
        ${c.default ? `<div class="small muted" style="margin-top:4px">Template default offered: <span class="mono">${esc(c.default)}</span></div>` : ""}</div>`;
      if (r2 && ["round2","sent2","resolved"].includes(s.stage)) body = `<div class="ans small"><b>Round 1 answer:</b> "${esc(r2.a1)}" <span class="chip c-warn">too vague</span></div>` + body;
      if (s.stage === "resolved") body += `<div class="ans"><div class="small muted">Customer answer</div>"${esc(r2 ? r2.a2 : c.answer)}"</div><div><b>Resolved value ${L("L")}:</b> <span class="mono">${esc(c.resolved)}</span></div>`;
      const acts = [];
      if (["drafted","round2"].includes(s.stage)) {
        acts.push(editing ? `<button class="btn" data-a="save" data-id="${c.id}">Save question</button>` : `<button class="btn" data-a="edit" data-id="${c.id}">Edit</button>`);
        acts.push(`<button class="btn primary" data-a="send" data-id="${c.id}">Approve &amp; send ${L("H")}</button>`);
      }
      if (["sent","sent2"].includes(s.stage)) acts.push(`<button class="btn" data-a="reply" data-id="${c.id}">Simulate customer reply</button>`);
      if (acts.length) body += `<div class="acts">${acts.join("")}</div>`;
    }
    return `<article class="req"><div class="top"><div class="pill-row"><span class="mono muted">${c.id}</span><span class="mono">${esc(c.settings)}</span>${c.priority ? `<span class="chip c-mut">${esc(c.priority)} impact</span>` : ""}</div>${clarStatus(c)}</div>
      <div class="small muted">"${esc(c.note)}"</div>${body}</article>`;
  }).join("");
  const pack = st.pack[id] ? packHtml(id) : "";
  return `
  <header class="head"><div><div class="eyebrow">Sales · Requirement Clarification Agent</div><h1>${esc(c0.name)}</h1>
    <p>The agent checks each requirement against the setting it maps to. If the requirement doesn't give a concrete value, it drafts a question. The SE approves every question before it reaches the customer.</p></div>
    <label class="small muted">Customer<br><select id="sel-clar">${custOpts("Sales", id)}</select></label></header>
  <div class="banner ${pend ? "info" : "ok"}"><div style="flex:1"><b>${done} of ${total} requirements settled</b> · ${pend ? `${pend} still open` : "ready for customer sign-off"}
    <div class="prog" style="margin-top:6px"><i style="width:${Math.round(done/total*100)}%"></i></div></div>
    <div class="acts pill-row">${drafted ? `<button class="btn" data-a="sendall">Approve &amp; send all drafted (${drafted}) ${L("H")}</button>` : ""}
    <button class="btn primary" data-a="pack" ${pend ? "disabled" : ""}>Prepare sign-off pack</button></div></div>
  ${pack}
  <div class="grid2">
    <section class="panel"><div class="ph"><h2>Handoff notes from sales</h2><span class="small muted">${c0.segment} · ${c0.city}</span></div><div class="pb notes">${notes}</div></section>
    <section class="panel"><div class="ph"><h2>Requirements and questions</h2>${L("L")}</div><div class="pb list">${reqs}</div></section>
  </div>`;
}
function packHtml(id){
  const rows = (clarBy[id] || []).filter(c => st.clar[c.id].stage !== "routed")
    .map(c => `<tr><td>${esc(c.note)}</td><td class="mono">${esc(c.resolved)}</td></tr>`).join("");
  const oos = (clarBy[id] || []).filter(c => st.clar[c.id].stage === "routed").map(c => esc(c.note)).join("; ");
  const targets = D.metrics.filter(m => m.id.startsWith("M")).map(m => `<span class="chip c-mut"><span class="mono">${m.id}</span> ${esc(m.name)}: ${esc(m.target)}</span>`).join(" ");
  const signed = st.signed[id];
  return `<section class="panel"><div class="ph"><h2>Sign-off pack ${L("L")}</h2>${signed ? `<span class="chip c-ok">Signed by customer</span>` : `<span class="chip c-warn">Awaiting customer signature</span>`}</div>
   <div class="pb"><div class="scroll"><table class="tbl pack"><thead><tr><th>Requirement (source)</th><th>Setting and agreed value</th></tr></thead><tbody>${rows}</tbody></table></div>
   ${oos ? `<p class="small muted">Out of scope, not configured: ${oos}</p>` : ""}
   <p class="small" style="margin:10px 0 6px"><b>Go-live targets in the same sign-off</b> (template defaults shown; agreed per customer):</p><div class="pill-row">${targets}</div>
   <div class="acts pill-row" style="margin-top:12px">${signed ? `<span class="small muted">Changes after sign-off are logged as change requests.</span>` : `<button class="btn primary" data-a="sign">Record customer sign-off ${L("H")}</button>`}</div></div></section>`;
}

/* ---------------- Sales: config checks ---------------- */
function viewChecks(){
  const id = st.checkCust, rows = checkBy[id] || [], c0 = cust[id];
  const res = r => st.fixed[r.id] ? "Pass" : r.result;
  const errs = rows.filter(r => res(r) === "Error" && r.blocks === "Yes").length;
  const warns = rows.filter(r => res(r) === "Warning").length;
  const chip = r => { const v = res(r); return v === "Error" ? `<span class="chip c-bad">Error</span>` : v === "Warning" ? `<span class="chip c-warn">Warning</span>` : `<span class="chip c-ok">${st.fixed[r.id] ? "Fixed" : "Pass"}</span>`; };
  const tr = rows.map(r => `<tr><td class="mono muted">${r.id}</td><td class="mono">${esc(r.setting)}</td><td>${esc(r.configured)}</td><td>${esc(r.signed)}</td><td class="mono small">${esc(r.check)}</td><td>${chip(r)}</td>
     <td class="small">${esc(r.why)}</td><td>${res(r) === "Error" ? `<button class="btn" data-a="fix" data-id="${r.id}">Mark fixed ${L("H")}</button>` : ""}</td></tr>`).join("");
  return `

   <label class="small muted">Customer<br><select id="sel-checks">${custOpts("Sales", id)}</select></label></header>
  <div class="banner ${errs ? "bad" : "ok"}"><div><b>${errs ? `Handoff to UAT blocked: ${errs} error${errs > 1 ? "s" : ""} to fix` : "Ready for handoff to UAT"}</b>

   <div class="scroll"><table class="tbl"><thead><tr><th>Check</th><th>Setting</th><th>Draft value</th><th>Signed-off / required</th><th>Rule</th><th>Result</th><th>Why</th><th></th></tr></thead><tbody>${tr}</tbody></table></div></section>`;
}

/* ---------------- UAT: diagnosis ---------------- */
const mid = m => m.split(" ")[0];
function visibleUat(id){ return (uatBy[id] || []).filter(u => u.id !== "UD-12" || st.uat["UD-07"] === "applied"); }
function metricState(id, m){
  const u = visibleUat(id).find(x => mid(x.metric) === m.id);
  if (!u) return { cls: "", label: "Pass", chip: "c-ok" };
  const s = st.uat[u.id];
  if (s === "applied") return { cls: "fixed", label: "Pass after fix", chip: "c-acc", u };
  if (s === "awaiting") return { cls: "wait", label: "Customer decision", chip: "c-warn", u };
  if (s === "retest") return { cls: "wait", label: "Re-test pending", chip: "c-info", u };
  if (s === "rule") return { cls: "fail", label: "Rule: routed", chip: "c-bad", u };
  return { cls: "fail", label: "Fail · " + u.observed, chip: "c-bad", u };
}
function viewUat(){
  const id = st.uatCust, c0 = cust[id], cases = visibleUat(id);
  if (!st.uatCase || !cases.find(u => u.id === st.uatCase)) st.uatCase = (cases.find(u => st.uat[u.id] === "open") || cases[0] || {}).id;
  const tiles = D.metrics.map(m => { const s = metricState(id, m);
    return `<button class="metric ${s.cls} ${s.u ? "click" : ""}" ${s.u ? `data-a="pick" data-id="${s.u.id}" aria-pressed="${s.u.id === st.uatCase}"` : "disabled"}>
      <span class="id">${m.id} · target ${esc(m.target)}</span><span class="nm">${esc(m.name)}</span><span class="chip ${s.chip}">${esc(s.label)}</span></button>`; }).join("");
  const u = cases.find(x => x.id === st.uatCase);
  return `
  <header class="head"><div><div class="eyebrow">UAT · Diagnosis &amp; Tuning Agent</div><h1>${esc(c0.name)}</h1>
   <p>Rules run the tests and narrow down which settings could cause a failure. The agent investigates the event data, tests a fix in a sandbox copy, then proposes it or hands the decision back to the customer.</p></div>
   <label class="small muted">Customer<br><select id="sel-uat">${custOpts("UAT", id)}</select></label></header>
  <section class="panel"><div class="ph"><h2>Go-live checklist ${L("R")}</h2><span class="small muted">Select a failing metric to see the diagnosis</span></div><div class="pb metrics">${tiles}</div></section>
  ${u ? diagHtml(u) : `<div class="panel empty">No open failures for this customer.</div>`}`;
}
function diagHtml(u){
  const s = st.uat[u.id];
  const shadow = u.id === "UD-06" ? `<span class="chip c-warn">J* ranks THR-10 first · disagrees · logged for evaluation</span>` : `<span class="chip c-mut">J* agrees with agent's top cause</span>`;
  const steps = [["Detect","R","Metric below target"],["Narrow","R","Dependency map"],["Investigate","L","Event patterns"],["Rank","J*","Shadow mode"],["Sandbox test","L","Clone + replay (A20)"],["Decide","H","Delivery engineer"]];
  const pipe = steps.map(x => `<div class="step"><b>${x[0]}</b>${L(x[1])}<span class="muted">${x[2]}</span></div>`).join("");
  let act = "";
  if (s === "rule") act = `<div class="box none"><h3>Handled by rules. AI not invoked.</h3><div>${esc(u.action)}</div></div>`;
  else if (u.cls.startsWith("Requirement")) act = `<div class="box ask"><h3>Needs a customer decision ${L("L")}</h3><div>The configuration matches the signed-off requirement, but the requirement can't meet the target. The agent won't change it. It drafts options for the customer instead:</div><div><b>${esc(u.action)}</b></div><div class="small">Sandbox estimate: ${esc(u.sandbox)}</div>
      <div class="acts pill-row">${s === "awaiting" ? `<span class="chip c-warn">Options sent · awaiting customer · will be logged as a change request</span>` : `<button class="btn primary" data-a="ask" data-id="${u.id}">Send options via delivery ${L("H")}</button>`}</div></div>`;
  else if (u.cls.startsWith("Test data")) act = `<div class="box none"><h3>No configuration change</h3><div>${esc(u.action)}</div>
      <div class="acts pill-row">${s === "retest" ? `<span class="chip c-info">Marked for re-run with realistic test data</span>` : `<button class="btn primary" data-a="retest" data-id="${u.id}">Mark test data for re-run ${L("H")}</button>`}</div></div>`;
  else act = `<div class="box prop"><h3>Proposed change ${L("L")}</h3><div><b>${esc(u.action)}</b></div><div class="small">Sandbox result on all metrics: ${esc(u.sandbox)}</div>
      <div class="acts pill-row">${s === "applied" ? `<span class="chip c-acc">Applied in UAT · snapshot saved · regression re-run passed</span>` : `<button class="btn primary" data-a="apply" data-id="${u.id}">Approve &amp; apply in UAT ${L("H")}</button><button class="btn danger" data-a="reject" data-id="${u.id}">Reject</button>`}</div></div>`;
  return `<section class="panel"><div class="ph"><h2><span class="mono muted">${u.id}</span> ${esc(u.metric)}: ${esc(u.observed)} vs ${esc(u.target)}</h2><span class="chip ${u.cls.startsWith("Configuration") ? "c-info" : u.cls.startsWith("Requirement") ? "c-warn" : "c-mut"}">${esc(u.cls)}</span></div>
   <div class="pb" style="display:flex;flex-direction:column;gap:14px">
    <div class="pipe">${pipe}</div>
    <dl class="kv">
      <dt>Narrowed to ${L("R")}</dt><dd class="mono">${esc(u.candidates)}</dd>
      <dt>Evidence ${L("L")}</dt><dd>${esc(u.evidence)}</dd>
      <dt>Root cause ${L("L")}</dt><dd>${esc(u.root)}</dd>
      <dt>Shadow check ${L("J*")}</dt><dd>${shadow}</dd>
    </dl>
    ${act}
    ${u.mustnot ? `<div class="guard"><b>Guardrail:</b> the agent will not ${esc(u.mustnot.charAt(0).toLowerCase() + u.mustnot.slice(1))}. Signed-off requirements are hard limits.</div>` : ""}
   </div></section>`;
}

/* ---------------- Production: safety net ---------------- */
function viewSafety(){
  const open = D.safety.filter(p => st.tickets[p.id] === "open").length;
  const tr = D.safety.map(p => { const t = st.tickets[p.id], c0 = cust[p.cust];
    const status = t === "none" ? `<span class="chip c-mut">Checked · no alert</span>` : t === "ack" ? `<span class="chip c-ok">Acknowledged</span>` : `<span class="chip ${p.sev === "P1" ? "c-bad" : "c-warn"}">${esc(p.sev)} · open</span>`;
    return `<tr><td class="mono muted">${p.id}</td><td>${esc(c0.name)}</td><td>${esc(p.signal)}</td><td class="mono">${esc(p.check)}</td><td>${status}</td><td class="small">${esc(p.route || "-")}</td><td class="small muted">${esc(p.why)}</td>
      <td>${t === "open" ? `<button class="btn" data-a="ack" data-id="${p.id}">Acknowledge ${L("H")}</button>` : ""}</td></tr>`; }).join("");
  return `
  <header class="head"><div><div class="eyebrow">Production · Safety net (MVP) ${L("R")}</div><h1>Live customer alerts</h1>
   <p>In the MVP, live customers are covered only by rules that can't be ambiguous: integration failing (H1), orders stuck (H3), approver missing (H4). Tickets go to the existing support tool and follow the escalation matrix.</p></div></header>
  <div class="banner info"><div><b>No AI touches live customers in the MVP.</b> <span class="small">AI diagnosis reaches production in V2, after it is proven on the golden data set and real UAT data.</span></div></div>
  <div class="kpis"><span class="chip c-bad">${open} open</span><span class="chip c-mut">${D.safety.filter(p => st.tickets[p.id] === "none").length} checked · no alert</span><span class="chip c-ok">${D.safety.filter(p => st.tickets[p.id] === "ack").length} acknowledged</span></div>
  <section class="panel"><div class="ph"><h2>Hourly checks</h2><span class="small muted">One ticket per issue per account · unacknowledged P1s re-escalate after 1 hour</span></div>
   <div class="scroll"><table class="tbl"><thead><tr><th>Case</th><th>Customer</th><th>Signal</th><th>Check</th><th>Status</th><th>Routed to</th><th>Why</th><th></th></tr></thead><tbody>${tr}</tbody></table></div></section>`;
}

/* ---------------- Production: drift V2 ---------------- */
function spark(d){
  const vals = d.weeks.concat([d.baseline]), lo = Math.min(...vals), hi = Math.max(...vals), pad = (hi - lo) * 0.15 || 1;
  const y = v => 62 - ((v - (lo - pad)) / ((hi + pad) - (lo - pad))) * 54, x = i => 8 + i * (284 / 7);
  const pts = d.weeks.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const area = `8,62 ${pts} ${x(7).toFixed(1)},62`;
  const col = d.cls.startsWith("Real") ? "var(--bad)" : d.cls.startsWith("Sustained") ? "var(--warn)" : "var(--info)";
  return `<svg class="spark" viewBox="0 0 300 70" role="img" aria-label="${esc(d.metric)} weekly values against baseline">
    <line x1="8" x2="292" y1="${y(d.baseline).toFixed(1)}" y2="${y(d.baseline).toFixed(1)}" stroke="var(--muted)" stroke-dasharray="4 3" stroke-width="1"/>
    <polygon points="${area}" fill="${col}" opacity=".12"/>
    <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2"/>
    <circle cx="${x(7).toFixed(1)}" cy="${y(d.weeks[7]).toFixed(1)}" r="3.5" fill="${col}"/>
    <text x="292" y="${(y(d.baseline) - 4).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--muted)">go-live baseline ${d.baseline}</text></svg>`;
}
function viewDrift(){
  const cards = D.drift.map(d => { const c0 = cust[d.cust], s = st.drift[d.id], real = d.cls.startsWith("Real");
    const chip = real ? "c-bad" : d.cls.startsWith("Sustained") ? "c-warn" : "c-info";
    const acts = real ? (s === "pending" ? `<div class="acts pill-row"><button class="btn primary" data-a="dapprove" data-id="${d.id}">Approve ${L("H")}</button><button class="btn" data-a="dreject" data-id="${d.id}">Reject</button></div>`
      : `<span class="chip ${s === "approved" ? "c-ok" : "c-mut"}">${s === "approved" ? "Approved · sent to existing approval flow · snapshot saved" : "Rejected · added to golden data set"}</span>`) : "";
    return `<article class="panel dcard"><div class="ph"><h2>${esc(c0.name)}</h2><span class="chip ${chip}">${esc(d.cls)}</span></div>
      <div class="pb" style="display:flex;flex-direction:column;gap:8px"><div class="small"><span class="mono">${esc(d.metric)}</span> · last 8 weeks (${esc(d.unit)})</div>${spark(d)}
      <div class="small"><b>Context:</b> ${esc(d.context)}</div><div class="small"><b>${real ? "Proposal" : "Outcome"} ${L(real ? "L" : "J*")}:</b> ${esc(d.action)}</div>${acts}</div></article>`; }).join("");
  return `
  <header class="head"><div><div class="eyebrow">Production · Fit monitoring · V2 preview</div><h1>Is each live configuration still right?</h1>
   <p>Rules compare each metric with the customer's go-live baseline, skipping known peaks. The fast decision layer separates real drift from noise, and the agent investigates real drift and drafts a fix for the CSM to approve.</p></div></header>
  <div class="banner info"><div><b>V2 preview.</b> <span class="small">Shown to illustrate the roadmap. Not part of the MVP.</span></div></div>
  <div class="cards">${cards}</div>`;
}

/* ---------------- Audit ---------------- */
function viewAudit(){
  const rows = st.log.map(e => `<div class="row"><span class="mono muted">${esc(e.t)}</span><span>${esc(e.actor)}</span><span>${L(e.layer)}</span><span>${esc(e.text)}</span></div>`).join("");
  return `<header class="head"><div><div class="eyebrow">Governance</div><h1>Audit trail</h1><p>Every agent output and every human decision, with the layer that produced it. Approved changes keep a snapshot for one-click rollback.</p></div></header>
   <section class="panel"><div class="pb log">${rows || `<div class="empty">No activity yet.</div>`}</div></section>`;
}

/* ---------------- Render + events ---------------- */
const VIEWS = { clar: viewClar, checks: viewChecks, uat: viewUat, safety: viewSafety, drift: viewDrift, audit: viewAudit };
function counts(){
  const pend = D.customers.filter(c => c.stage === "Sales").reduce((a, c) => a + pendingOf(c.id), 0);
  $("#n-clar").textContent = pend || "";
  $("#n-checks").textContent = D.checks.filter(r => r.result === "Error" && !st.fixed[r.id]).length || "";
  $("#n-uat").textContent = D.uat.filter(u => st.uat[u.id] === "open" && (u.id !== "UD-12" || st.uat["UD-07"] === "applied")).length || "";
  $("#n-safety").textContent = D.safety.filter(p => st.tickets[p.id] === "open").length || "";
  $("#n-audit").textContent = st.log.length;
}
function render(){
  $("#view").innerHTML = VIEWS[st.view]();
  document.querySelectorAll(".nav").forEach(n => n.setAttribute("aria-current", n.dataset.view === st.view ? "page" : "false"));
  counts();
}
document.addEventListener("click", e => {
  const nav = e.target.closest(".nav"); if (nav) { st.view = nav.dataset.view; render(); window.scrollTo(0, 0); return; }
  const b = e.target.closest("[data-a]"); if (!b || b.disabled) return;
  const a = b.dataset.a, id = b.dataset.id, c = D.clarification.find(x => x.id === id);
  if (a === "edit") st.edit[id] = true;
  if (a === "save") { st.clar[id].q = $("#ta-" + id).value; st.edit[id] = false; log("SE", "H", `${id}: edited the drafted question.`); }
  if (a === "send") { const s = st.clar[id]; if (st.edit[id]) { s.q = $("#ta-" + id).value; st.edit[id] = false; } s.stage = s.stage === "round2" ? "sent2" : "sent"; log("SE", "H", `${id}: approved and sent question to ${cust[c.cust].name}.`); }
  if (a === "sendall") { (clarBy[st.clarCust] || []).forEach(x => { const s = st.clar[x.id]; if (["drafted","round2"].includes(s.stage)) s.stage = s.stage === "round2" ? "sent2" : "sent"; }); log("SE", "H", `Approved and sent all drafted questions to ${cust[st.clarCust].name}.`); }
  if (a === "reply") { const s = st.clar[id];
    if (ROUND2[id] && s.stage === "sent") { s.stage = "round2"; s.q = ROUND2[id].q2; log("Copilot", "L", `${id}: customer answer still vague; drafted a round-2 question.`); }
    else { s.stage = "resolved"; log("Copilot", "L", `${id}: interpreted customer answer; set ${c.resolved}.`); } }
  if (a === "pack") { st.pack[st.clarCust] = true; log("Copilot", "L", `Compiled sign-off pack for ${cust[st.clarCust].name}.`); }
  if (a === "sign") { st.signed[st.clarCust] = true; log("SE", "H", `Recorded customer sign-off for ${cust[st.clarCust].name}. Configuration now built on signed-off values.`); }
  if (a === "fix") { st.fixed[id] = true; log("SE", "H", `${id}: fixed in sandbox; checks re-run.`); }
  if (a === "pick") st.uatCase = id;
  if (a === "apply") { st.uat[id] = "applied"; log("Delivery engineer", "H", `${id}: approved and applied fix in UAT. Snapshot saved; regression re-run on all metrics.`);
    if (id === "UD-07") log("Copilot", "R", "Regression re-run after UD-07: M9 now passes, but M4 dropped from 97% to 93%. Opened UD-12."); }
  if (a === "reject") log("Delivery engineer", "H", `${id}: rejected proposal. Case added to golden data set for review.`);
  if (a === "ask") { st.uat[id] = "awaiting"; log("Delivery engineer", "H", `${id}: sent decision options to customer. Will be logged as a change request.`); }
  if (a === "retest") { st.uat[id] = "retest"; log("Delivery engineer", "H", `${id}: marked test data for re-run. No configuration change.`); }
  if (a === "ack") { st.tickets[id] = "ack"; log("CSM / Support", "H", `${id}: acknowledged ticket.`); }
  if (a === "dapprove") { st.drift[id] = "approved"; log("CSM", "H", `${id}: approved drift fix; sent to existing approval flow.`); }
  if (a === "dreject") { st.drift[id] = "rejected"; log("CSM", "H", `${id}: rejected drift fix; added to golden data set.`); }
  render();
});
document.addEventListener("change", e => {
  if (e.target.id === "sel-clar") st.clarCust = e.target.value;
  if (e.target.id === "sel-checks") st.checkCust = e.target.value;
  if (e.target.id === "sel-uat") { st.uatCust = e.target.value; st.uatCase = null; }
  render();
});
const hash = (location.hash || "").slice(1); if (VIEWS[hash]) st.view = hash;
render();
</script>
