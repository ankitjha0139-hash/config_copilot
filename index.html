<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Configuration Copilot prototype for the Vertex Ops case (HashedIn by Deloitte PM case study). Synthetic data; all customers fictional.">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Configuration Copilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F4F6F8; --panel:#FFFFFF; --ink:#16212E; --muted:#5B6878; --line:#DCE2E8; --soft:#EEF2F5;
  --accent:#0E6B6B; --accent-ink:#FFFFFF; --accent-soft:#E2F1EF;
  --ok:#1F7A4D; --ok-soft:#E3F3EA; --warn:#A76A00; --warn-soft:#FBF0DA; --bad:#B3261E; --bad-soft:#FBE6E4; --info:#3B5BA9; --info-soft:#E7ECF8;
  --rail:#1B2A41; --rail-ink:#D7DEE8; --rail-active:#2A3D5A;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F151D; --panel:#16202B; --ink:#E6ECF2; --muted:#9AA8B8; --line:#2A3746; --soft:#1C2834;
  --accent:#3FB2A8; --accent-ink:#06201E; --accent-soft:#16332F;
  --ok:#5CC48E; --ok-soft:#163223; --warn:#E3A73B; --warn-soft:#352812; --bad:#F07A70; --bad-soft:#3A1A18; --info:#8EA8F0; --info-soft:#1C2540;
  --rail:#0B1118; --rail-ink:#B8C4D2; --rail-active:#1D2A3A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F151D; --panel:#16202B; --ink:#E6ECF2; --muted:#9AA8B8; --line:#2A3746; --soft:#1C2834;
  --accent:#3FB2A8; --accent-ink:#06201E; --accent-soft:#16332F;
  --ok:#5CC48E; --ok-soft:#163223; --warn:#E3A73B; --warn-soft:#352812; --bad:#F07A70; --bad-soft:#3A1A18; --info:#8EA8F0; --info-soft:#1C2540;
  --rail:#0B1118; --rail-ink:#B8C4D2; --rail-active:#1D2A3A; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.head{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end}
.head h1{font-family:var(--display);font-size:24px;margin:0;text-wrap:balance}
.head p{margin:2px 0 0;color:var(--muted);max-width:70ch}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:600}
select,button,textarea{font:inherit}
select{padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 12px;border-radius:6px;font-size:13px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-width:0}
.panel>.ph{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.panel>.ph h2{font-size:14px;margin:0;font-weight:600}
.panel>.pb{padding:12px 14px}
.grid2{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:16px;align-items:start}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.c-ok{background:var(--ok-soft);color:var(--ok)} .c-warn{background:var(--warn-soft);color:var(--warn)} .c-bad{background:var(--bad-soft);color:var(--bad)}
.c-info{background:var(--info-soft);color:var(--info)} .c-acc{background:var(--accent-soft);color:var(--accent)} .c-mut{background:var(--soft);color:var(--muted)}
.layer{font-family:var(--mono);font-size:10.5px;font-weight:500;padding:1px 6px;border-radius:4px;border:1px solid currentColor;opacity:.9}
.L-R{color:var(--info)} .L-J{color:var(--warn)} .L-L{color:var(--accent)} .L-H{color:var(--ok)}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted)}
.kpis{display:flex;flex-wrap:wrap;gap:8px}
.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
.banner.bad{border-color:var(--bad);background:var(--bad-soft)} .banner.ok{border-color:var(--ok);background:var(--ok-soft)} .banner.info{border-color:var(--info);background:var(--info-soft)}
.notes{display:flex;flex-direction:column;gap:8px}
.note{padding:8px 10px;border-left:3px solid var(--line);background:var(--soft);border-radius:0 6px 6px 0;font-size:13.5px}
.note.amb{border-left-color:var(--warn)} .note.clear{border-left-color:var(--ok)} .note.oos{border-left-color:var(--muted)}
.note .meta{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.req{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--panel)}
.req .top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.req .q{background:var(--soft);border-radius:6px;padding:8px 10px}
.req .q label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;display:block;margin-bottom:2px}
.req textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--panel);color:var(--ink)}
.req .acts{display:flex;gap:8px;flex-wrap:wrap}
.req .ans{border-left:3px solid var(--accent);padding:4px 10px}
.list{display:flex;flex-direction:column;gap:10px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
.scroll{overflow-x:auto}
.metrics{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.metric{all:unset;box-sizing:border-box;cursor:default;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--panel);display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden}
.metric::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--ok)}
.metric.fail::before{background:var(--bad)} .metric.wait::before{background:var(--warn)} .metric.fixed::before{background:var(--accent)}
.metric.click{cursor:pointer} .metric.click:hover{border-color:var(--accent)} .metric[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.metric .id{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.metric .nm{font-size:12.5px;font-weight:600;line-height:1.25}
.pipe{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.step{border:1px solid var(--line);border-radius:6px;padding:7px 8px;font-size:12px;background:var(--soft);display:flex;flex-direction:column;gap:3px}
.step b{font-size:12px}
.step .layer,.metric .chip{align-self:flex-start}
.btn.primary .layer{color:var(--accent-ink);border-color:currentColor;opacity:.85}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 12px;font-size:13.5px}
.kv dt{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.kv dd{margin:0}
.box{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.box.prop{border-color:var(--accent);background:var(--accent-soft)} .box.ask{border-color:var(--warn);background:var(--warn-soft)} .box.none{border-color:var(--info);background:var(--info-soft)}
.box h3{margin:0;font-size:13.5px}
.guard{font-size:12.5px;color:var(--bad);display:flex;gap:6px;align-items:baseline}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.dcard{display:flex;flex-direction:column;gap:8px}
.spark{width:100%;height:70px;display:block}
.log{display:flex;flex-direction:column}
.log .row{display:grid;grid-template-columns:120px 120px 46px minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:baseline}
.empty{padding:20px;text-align:center;color:var(--muted)}
.pill-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.small{font-size:12px}
.prog{height:6px;background:var(--soft);border-radius:999px;overflow:hidden;min-width:120px}
.prog i{display:block;height:100%;background:var(--accent)}
.pack td:first-child{width:42%}
@media (max-width: 900px){
  .grid2{grid-template-columns:1fr}
  .pipe{grid-template-columns:repeat(4,minmax(0,1fr))}
  .kv{grid-template-columns:1fr}
  .log .row{grid-template-columns:1fr;gap:2px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.modebar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 10px;border:1px dashed var(--line);border-radius:8px;background:var(--soft)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:5px 10px;font-size:12.5px;font-weight:600;color:var(--muted);background:var(--panel)}
.seg button.on{background:var(--warn);color:#fff}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--panel);min-width:0}
.card.decide{background:var(--soft)}
.cardh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sn{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 4px;border-radius:999px;background:var(--ink);color:var(--panel);font-size:11px;font-weight:700}
.step .sn{margin-right:2px}
.bars{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.bar{display:grid;grid-template-columns:170px 1fr 40px;align-items:center;gap:8px}
.bl{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt{height:12px;background:var(--soft);border-radius:999px;overflow:hidden}
.bf{display:block;height:100%;background:var(--warn);opacity:.55;border-radius:999px}
.bf.top{opacity:1}
.bv{font-size:12px;text-align:right}
.chks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.chk{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:8px;border:1px solid var(--line);border-radius:6px}
.ci{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700}
.ch{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:3px}
.agree{margin-top:8px;padding:8px 10px;border-radius:6px;font-size:13px}
.agree.ok{background:var(--ok-soft)} .agree.warn{background:var(--warn-soft)}
.diff .was,.tbl .was{color:var(--bad);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--bad) 50%,transparent)}
.diff .now,.tbl .now{color:var(--ok);font-weight:600}
.cur{color:var(--bad);font-weight:600}
.step .sn{align-self:flex-start}
.code{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);margin-left:5px;font-weight:400;white-space:nowrap}
.nm{font-weight:600}
.nc{margin-right:8px;white-space:nowrap}
.est{font-size:11px;color:var(--warn);font-weight:600}
.req-s{color:var(--accent);font-weight:600}
.opts{margin:6px 0 0;padding-left:18px}

/* v2 layout: top bar with one tab per team; overview dashboard first. */
.topbar{position:sticky;top:0;z-index:5;background:var(--rail);color:var(--rail-ink);padding:10px max(16px, env(safe-area-inset-right,0px)) 0 max(16px, env(safe-area-inset-left,0px))}
.topin{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.brandrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.brandrow b{font-family:var(--display);font-size:19px;color:#fff;letter-spacing:.2px}
.brandrow span{font-size:11px;opacity:.75;text-transform:uppercase;letter-spacing:.08em}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:1px;padding:8px 14px 9px;border-radius:8px 8px 0 0;color:var(--rail-ink);white-space:nowrap;border-top:3px solid transparent}
.tab b{font-size:13.5px;font-weight:600;display:flex;gap:6px;align-items:center}
.tab small{font-size:11px;opacity:.7}
.tab:hover{background:var(--rail-active)}
.tab[aria-current="page"]{background:var(--bg);color:var(--ink)}
.tab[aria-current="page"] small{opacity:.8;color:var(--muted)}
.tab.s-sales{border-top-color:var(--info)} .tab.s-uat{border-top-color:var(--accent)} .tab.s-prod{border-top-color:var(--warn)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.badge{font-size:10.5px;font-weight:700;padding:0 6px;border-radius:999px;background:var(--bad);color:#fff;line-height:16px}
main{padding-block:22px 40px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));min-width:0}
.stages{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stage{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:14px;display:flex;flex-direction:column;gap:10px;border-top:4px solid var(--line)}
.stage.s-sales{border-top-color:var(--info)} .stage.s-uat{border-top-color:var(--accent)} .stage.s-prod{border-top-color:var(--warn)}
.stage h2{margin:0;font-family:var(--display);font-size:19px}
.team{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.stat{background:var(--soft);border-radius:8px;padding:8px}
.stat b{display:block;font-family:var(--display);font-size:22px;line-height:1.1}
.stat span{font-size:11.5px;color:var(--muted)}
.stat.bad b{color:var(--bad)} .stat.warn b{color:var(--warn)} .stat.ok b{color:var(--ok)}
.loop{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.lstep{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--panel);display:flex;flex-direction:column;gap:4px;position:relative}
.lstep b{font-size:13.5px}
.lstep .layer,.stage .layer{align-self:flex-start}
.icard .spark{height:90px}
.metric .id{font-family:var(--body);font-size:11.5px}
#csd{scroll-margin-top:120px}
@media (max-width:600px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))!important}}
.crumb{all:unset;cursor:pointer;color:var(--accent);font-size:13px;font-weight:600}
.crumb:hover{text-decoration:underline}
.subtabs{display:flex;gap:6px;flex-wrap:wrap}
.subtab{all:unset;cursor:pointer;padding:6px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:600;background:var(--panel);color:var(--muted)}
.subtab[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.subtab:focus-visible,.crumb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rowbtn{cursor:pointer}
.rowbtn:hover td{background:var(--soft)}
.rowbtn[aria-selected="true"] td{background:var(--accent-soft)}
.who{display:flex;flex-direction:column}
.who small{color:var(--muted);font-size:12px}
.issues{display:flex;flex-wrap:wrap;gap:4px}
.pri-a{background:var(--bad-soft);color:var(--bad)} .pri-w{background:var(--warn-soft);color:var(--warn)} .pri-f{background:var(--soft);color:var(--muted)}
.icard{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--panel)}
.icard.alert{border-left:4px solid var(--bad)} .icard.fit{border-left:4px solid var(--warn)}
.ihead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.llm{border:1px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:10px 12px}
.v2{border:1px dashed var(--line);border-radius:8px;padding:8px 12px;color:var(--muted);font-size:12.5px}
.score{display:flex;align-items:baseline;gap:6px}.score b{font-family:var(--display);font-size:20px}
.dn{color:var(--bad);font-weight:600}.up{color:var(--ok);font-weight:600}
.dist{display:flex;height:12px;border-radius:999px;overflow:hidden;gap:2px;margin-top:10px}.dist i{display:block}
.scorebox{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}.big{font-family:var(--display);font-size:44px;line-height:1}
.bar.sig{grid-template-columns:minmax(150px,240px) 1fr 34px}
.mail{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.mailh{background:var(--soft);padding:10px 12px;font-size:12.5px;display:flex;flex-direction:column;gap:2px;border-bottom:1px solid var(--line)}
.mailb{padding:10px 12px;font-size:13.5px}.mailb p{margin:0 0 8px}.linkish{color:var(--accent);font-weight:600}
.slack{border:1px solid var(--line);border-left:4px solid #4A154B;border-radius:8px;padding:10px 12px;background:var(--panel);font-size:13.5px;display:flex;flex-direction:column;gap:6px}
.slh{display:flex;gap:8px;align-items:center}.slav{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:6px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700}
.tag2{font-size:10px;font-weight:700;background:var(--soft);color:var(--muted);padding:0 5px;border-radius:3px}
.slist{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.slbtn{all:unset;cursor:pointer;align-self:flex-start;border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:12.5px;font-weight:600}
.gate-ok{color:var(--ok);font-weight:600} .gate-wait{color:var(--warn);font-weight:600}
.foot{font-size:12px;color:var(--muted);text-align:center;padding-top:8px}
.ro{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:600;color:var(--ok);background:var(--ok-soft);padding:3px 10px;border-radius:999px}
@media (max-width: 900px){.stages{grid-template-columns:1fr}.loop{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<header class="topbar">
  <div class="topin">
    <div class="brandrow"><b>Configuration Copilot</b><span>Vertex Ops · internal tool · demo with synthetic data</span></div>
    <nav class="tabs" aria-label="Workspaces">
      <button class="tab" data-view="home"><b>Overview</b><small>Everyone</small></button>
      <button class="tab s-sales" data-view="se"><b>Sales <span class="badge" id="b-se" hidden></span></b><small>Sales engineers</small></button>
      <button class="tab s-uat" data-view="dl"><b>UAT <span class="badge" id="b-dl" hidden></span></b><small>Delivery team</small></button>
      <button class="tab s-prod" data-view="cs"><b>Production <span class="badge" id="b-cs" hidden></span></b><small>Customer success</small></button>
      <button class="tab" data-view="gov"><b>Quality &amp; audit</b><small>Copilot PM · platform eng.</small></button>
    </nav>
  </div>
</header>

/* ---------------- UAT ---------------- */
const mid = m => m.split(" ")[0];
function metricState(id, m){
  const u = visibleUat(id).find(x => mid(x.metric) === m.id);
  if (!u) return { cls: "", label: "Pass", chip: "c-ok" };
  const s = st.uat[u.id];
  if (s === "applied") return { cls: "fixed", label: "Pass after fix", chip: "c-acc", u };
  if (s === "awaiting") return { cls: "wait", label: "Customer decision", chip: "c-warn", u };
  if (s === "retest") return { cls: "wait", label: "Re-test pending", chip: "c-info", u };
  if (s === "rule") return { cls: "fail", label: "Rule: routed", chip: "c-bad", u };

function spark(d){
  const vals = d.weeks.concat([d.baseline]), lo = Math.min(...vals), hi = Math.max(...vals), pad = (hi - lo) * 0.15 || 1;
  const y = v => 62 - ((v - (lo - pad)) / ((hi + pad) - (lo - pad))) * 54, x = i => 8 + i * (284 / 7);
  const pts = d.weeks.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const col = d.cls.startsWith("Real") ? "var(--bad)" : d.cls.startsWith("Sustained") ? "var(--warn)" : "var(--info)";
  return `<svg class="spark" viewBox="0 0 300 70" preserveAspectRatio="none" role="img" aria-label="${esc(d.metric)}: last 8 weeks against this account's normal">
    <line x1="8" x2="292" y1="${y(d.baseline).toFixed(1)}" y2="${y(d.baseline).toFixed(1)}" stroke="var(--muted)" stroke-dasharray="4 3" stroke-width="1" vector-effect="non-scaling-stroke"/>
    <polygon points="8,62 ${pts} ${x(7).toFixed(1)},62" fill="${col}" opacity=".12"/>
    <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>
    <div class="small muted">Week 1 to week 8 · now <b style="color:${col}">${d.weeks[7]}</b> · dashed line = this account's normal (${d.baseline})</div>`;
}

const bandChip = b => `<span class="chip ${b === "Critical" ? "c-bad" : b === "At risk" ? "c-warn" : "c-ok"}">${esc(b)}</span>`;
const bandCol = b => b === "Critical" ? "var(--bad)" : b === "At risk" ? "var(--warn)" : "var(--ok)";

  if (a === "reply") { const s = st.clar[id];
    if (ROUND2[id] && s.stage === "sent") { s.stage = "round2"; s.q = ROUND2[id].q2; log("Copilot", "L", `Customer answer still vague (${cust[c.cust].name}); drafted a follow-up question.`); }
    else { s.stage = "resolved"; log("Copilot", "L", `Interpreted ${cust[c.cust].name}'s answer: ${c.resolved}.`); } }
  if (a === "pack") { st.pack[st.seAcc] = true; log("Copilot", "L", `Compiled the sign-off pack for ${cust[st.seAcc].name}.`); }
  if (a === "sign") { st.signed[st.seAcc] = true; log("SE", "H", `Recorded customer sign-off for ${cust[st.seAcc].name}.`); }
  if (a === "fix") { st.fixed[id] = true; log("SE", "H", `Fixed a configuration error for ${cust[st.seAcc].name}; checks re-run.`); }
  if (a === "pick") st.uatCase = id;
  if (a === "jev" && st.jev !== id) { st.jev = id; log("Delivery lead", "H", id === "live" ? "Viewed a diagnosis with Jev live (allowed after the 80% agreement gate)." : "Viewed a diagnosis in shadow mode (MVP)."); }
  if (a === "apply") { st.uat[id] = "applied"; const ch = ((D.traces || {})[id] || {change: []}).change.map(x => `${x.setting}: ${x.from} → ${x.to}`).join("; ");
    log("Delivery lead", "H", `Approved and applied a fix in UAT for ${cust[st.dlAcc].name} (${ch}). Snapshot saved; all checks re-run.`);
    if (id === "UD-07") log("Copilot", "R", "Re-run after the fix: integration load now passes, but on-time dispatch dropped from 97% to 93%. New diagnosis opened."); }
  if (a === "reject") log("Delivery lead", "H", `Rejected a proposal for ${cust[st.dlAcc].name}; case added to the golden data set.`);
  if (a === "ask") { st.uat[id] = "awaiting"; log("Delivery lead", "H", `Sent options to ${cust[st.dlAcc].name}; their choice will come back as a change request.`); }
  if (a === "retest") { st.uat[id] = "retest"; log("Delivery lead", "H", `Marked test data for re-run (${cust[st.dlAcc].name}); no configuration change.`); }
  if (a === "ack") { st.tickets[id] = "ack"; log("CSM", "H", `Acknowledged an alert for ${cust[caseOf[id].cust].name}.`); }
  if (a === "csmine") { st.cs[id] = "mine"; log("CSM", "H", `Took ownership of ${cust[id].name} from today's report.`); }
  if (a === "csspec") { st.cs[id] = "spec"; log("CSM", "H", `Asked a configuration specialist to look at ${cust[id].name} (as today; in V2 the agent drafts the fix).`); }
  if (a === "csexp") { st.cs[id] = "expected"; log("CSM", "H", `Marked ${cust[id].name} as expected; feedback saved for tuning and the golden set.`); }
  if (a === "csreset") st.cs[id] = "new";
  render();
  if (scrollTo === 0) window.scrollTo(0, 0); else if (scrollTo) { const el = $(scrollTo); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); }
});
document.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches("tr.rowbtn")) { e.preventDefault(); e.target.click(); } });
const hash = (location.hash || "").slice(1); if (VIEWS[hash]) st.view = hash;
render();
</script>
